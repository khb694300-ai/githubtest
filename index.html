<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efe6d6">
<title>영어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe6d6;
    --ink: #1e1a16;
    --muted: #5c5348;
    --card: #fffaf3;
    --line: #e3d5c0;
    --accent: #8d3414;
    --green: #1f6b4a;
    --green-soft: #e7f3ec;
    --bad-soft: #fdeee6;
    --shadow: 0 18px 50px rgba(70, 42, 18, 0.12);
    --sans: "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --serif: Fraunces, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 0% 0%, rgba(141, 52, 20, 0.1), transparent 42%),
      radial-gradient(ellipse at 100% 0%, rgba(31, 107, 74, 0.1), transparent 38%);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  ::selection { background: #f0c7a4; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 56px; }
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 14px 0 10px;
    background: rgba(239, 230, 214, 0.92);
    backdrop-filter: blur(14px);
  }
  header {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) minmax(280px, 420px) auto;
    gap: 14px;
    align-items: center;
  }
  .brand { display: flex; gap: 12px; align-items: center; }
  .mark {
    width: 48px; height: 48px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--ink); color: #fffaf3;
    font-family: var(--serif); font-weight: 680; font-size: 20px;
  }
  .eyebrow { margin: 0; color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.03em; }
  .lede { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
  .stat { background: rgba(255, 250, 243, 0.72); border: 1px solid var(--line); border-radius: 16px; padding: 8px 10px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.hit { background: var(--green-soft); border-color: transparent; }
  .stat.hit b, .stat.hit span { color: var(--green); }
  .tabs, .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs { margin-top: 10px; }
  .filters { margin-top: 10px; }
  .tab, .chip, .btn, .textbtn, .choice, .seg button {
    border: 1px solid var(--line);
    background: rgba(255, 250, 243, 0.8);
    border-radius: 999px;
  }
  .tab, .chip { padding: 8px 14px; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fffaf3; border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: #f6e3d6; color: var(--accent); border-color: #f0cbb6; font-weight: 600; }
  .help { min-height: 1.4em; margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  kbd {
    font-family: inherit;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 0 5px;
    background: #fff;
    font-size: 12px;
  }
  .panel {
    margin-top: 8px;
    animation: rise 0.35s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .progress-row, .row, .actions, .speak-row, .bookbar, .word-top {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .progress-row { justify-content: space-between; color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: rgba(30, 26, 22, 0.08); border-radius: 99px; overflow: hidden; margin: 8px 0 16px; }
  .bar span { display: block; height: 100%; background: var(--green); }
  .textbtn { border: 0; background: transparent; color: var(--accent); padding: 4px 2px; border-radius: 8px; }
  .scene { perspective: 1200px; }
  .card {
    display: grid;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.2, .7, .2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 28px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid rgba(80, 50, 20, 0.08);
    box-shadow: var(--shadow);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.front { align-items: center; text-align: center; }
  .face.back { align-items: flex-start; transform: rotateY(180deg); }
  .card .back { pointer-events: none; }
  .card.flipped .front { pointer-events: none; }
  .card.flipped .back { pointer-events: auto; }
  .pill, .meta { color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; background: #f6efe4;
  }
  .pill.learn { background: var(--bad-soft); color: var(--accent); }
  .pill.known { background: var(--green-soft); color: var(--green); }
  .word, .prompt {
    margin: 0;
    font-family: var(--serif);
    font-weight: 680;
    font-size: clamp(40px, 8vw, 68px);
    letter-spacing: -0.04em;
    line-height: 1.05;
    overflow-wrap: anywhere;
  }
  .prompt { font-size: clamp(34px, 6vw, 56px); }
  .ko-large {
    margin: 0;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.25;
  }
  .ex { margin: 8px 0 0; font-family: var(--serif); font-size: 22px; font-weight: 560; line-height: 1.35; }
  .exko { margin: 4px 0 0; color: var(--muted); }
  .hintline { margin: 4px 0 0; color: var(--muted); }
  .speak-row { justify-content: center; }
  .face.back .speak-row { justify-content: flex-start; }
  .iconbtn, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 999px; padding: 10px 14px;
  }
  .iconbtn { border: 1px solid var(--line); background: #fff; }
  .iconbtn svg, .word-btn svg { display: block; }
  .actions { margin-top: 10px; }
  .btn { padding: 12px 18px; border: 1px solid transparent; }
  .btn.primary { background: var(--ink); color: #fffaf3; }
  .btn.good { background: var(--green); color: white; }
  .btn.ghost { background: #fffaf3; border-color: var(--line); }
  .btn.wide { flex: 1; min-width: 140px; }
  .btn:active, .choice:active, .tab:active { transform: translateY(1px); }
  .kicker { margin: 18px 0 6px; color: var(--muted); }
  .choices { display: grid; gap: 8px; }
  .choice {
    width: 100%;
    text-align: left;
    border-radius: 16px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .choice .key {
    width: 28px; height: 28px; flex: 0 0 28px;
    display: grid; place-items: center;
    border-radius: 8px; background: #f6efe4; font-size: 13px;
  }
  .choice.good { background: var(--green-soft); border-color: var(--green); }
  .choice.bad { background: var(--bad-soft); border-color: var(--accent); }
  .choice.dim { opacity: 0.45; }
  .seg { display: flex; gap: 6px; }
  .seg button { padding: 6px 10px; border-radius: 999px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fffaf3; border-color: var(--ink); }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: #fff; }
  .result.good { background: var(--green-soft); }
  .result.bad { background: var(--bad-soft); }
  .spell {
    width: 100%;
    font-family: var(--serif);
    font-size: clamp(28px, 6vw, 42px);
    padding: 8px 0;
    border: 0;
    border-bottom: 2px solid var(--ink);
    border-radius: 0;
    background: transparent;
  }
  .spell:focus { outline: none; border-bottom-color: var(--accent); }
  .spell:disabled { color: var(--ink); opacity: 1; }
  .bookbar { justify-content: space-between; margin-bottom: 6px; }
  .bookbar input {
    flex: 1;
    min-width: 180px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
  }
  .cat-title { margin: 22px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .cat-title span { font-weight: 500; }
  .word-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .word-btn {
    border: 0; background: transparent; padding: 0;
    font-family: var(--serif); font-size: 28px; font-weight: 560;
    letter-spacing: -0.03em; text-align: left;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .word-btn:hover { color: var(--accent); }
  .ko { margin: 2px 0; font-weight: 600; }
  .tag { font-size: 12px; color: var(--accent); font-weight: 600; }
  .tag.ok { color: var(--green); }
  .exline { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .exline span { color: var(--ink); font-family: var(--serif); font-size: 16px; }
  .done h2 { font-family: var(--serif); font-size: clamp(48px, 10vw, 80px); margin: 0; letter-spacing: -0.04em; }
  .miss-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .miss-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .empty { color: var(--muted); }
  .foot { color: var(--muted); font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%) translateY(12px);
    opacity: 0; pointer-events: none;
    background: var(--ink); color: #fffaf3;
    padding: 10px 14px; border-radius: 999px;
    transition: 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
  }
  @media (max-width: 860px) {
    header { grid-template-columns: 1fr auto; }
    .stats { grid-column: 1 / -1; }
    #reset { grid-column: 2; grid-row: 1; align-self: center; }
  }
  @media (max-width: 640px) {
    h1 { font-size: 24px; }
    .lede { display: none; }
    .stats { gap: 6px; }
    .stat { padding: 6px 8px; }
    .stat b { font-size: 18px; }
    .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .chip { flex: 0 0 auto; }
    .face { padding: 16px 18px; min-height: 0; }
    .bar { margin: 6px 0 10px; }
    .help { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" role="status"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
const CATS = ["기초", "일상", "감정", "여행", "직장", "학습", "사회"];
const GOAL = 10;

const KEY = "english-vocab-v1";

const WORDS = [
  { en: "water", ko: "물", pos: "명사", cat: "기초", ex: "Please drink some water.", exKo: "물을 좀 마시세요." },
  { en: "friend", ko: "친구", pos: "명사", cat: "기초", ex: "She is my best friend.", exKo: "그녀는 나의 가장 친한 친구이다." },
  { en: "family", ko: "가족", pos: "명사", cat: "기초", ex: "My family lives in Seoul.", exKo: "우리 가족은 서울에 산다." },
  { en: "school", ko: "학교", pos: "명사", cat: "기초", ex: "The school is near my house.", exKo: "학교는 우리 집 근처에 있다." },
  { en: "money", ko: "돈", pos: "명사", cat: "기초", ex: "I need some money for lunch.", exKo: "점심값으로 쓸 돈이 필요하다." },
  { en: "weather", ko: "날씨", pos: "명사", cat: "기초", ex: "The weather is cold today.", exKo: "오늘 날씨가 춥다." },
  { en: "happy", ko: "행복한", pos: "형용사", cat: "기초", ex: "I feel happy today.", exKo: "나는 오늘 행복하다." },

  { en: "listen", ko: "듣다", pos: "동사", cat: "기초", ex: "Please listen to the teacher.", exKo: "선생님 말씀을 잘 들으세요." },

  { en: "travel", ko: "여행하다", pos: "동사", cat: "기초", ex: "They travel every summer.", exKo: "그들은 여름마다 여행을 한다." },

  { en: "borrow", ko: "빌리다", pos: "동사", cat: "일상", ex: "Can I borrow your pen?", exKo: "펜 좀 빌려도 될까요?" },

  { en: "departure", ko: "출발", pos: "명사", cat: "여행", ex: "Our departure is at 6 a.m.", exKo: "출발은 아침 6시이다." },
  { en: "luggage", ko: "짐", pos: "명사", cat: "여행", ex: "Her luggage is still at the airport.", exKo: "그녀의 짐이 아직 공항에 있다." },

  { en: "deadline", ko: "마감", pos: "명사", cat: "직장", ex: "The deadline is Friday.", exKo: "마감은 금요일이다." },

function load() {
  const empty = { known: {}, learning: {}, lastDate: "", streak: 0, todayDate: "", todayWords: [], filter: "기초" };
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || typeof raw !== "object") return empty;
    return {
      known: raw.known || {},
      learning: raw.learning || {},
      lastDate: raw.lastDate || "",
      streak: raw.streak || 0,
      todayDate: raw.todayDate || "",
      todayWords: Array.isArray(raw.todayWords) ? raw.todayWords : [],
      filter: raw.filter || "기초"
    };
  } catch (err) {
    return empty;
  }
}

function pad(n) { return String(n).padStart(2, "0"); }
function dateStr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayStr() { return dateStr(new Date()); }
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return dateStr(d);
}
function todayShown() { return state.todayDate === todayStr() ? state.todayWords.length : 0; }
function streakShown() {
  const t = todayStr();
  if (state.lastDate === t || state.lastDate === yesterdayStr()) return state.streak;
  return 0;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function speakerIcon() {
  return '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16.5 9.2a3.2 3.2 0 0 1 0 5.6M18.8 7a6.2 6.2 0 0 1 0 10"/></svg>';
}
function norm(s) {
  return String(s || "").trim().toLowerCase().replace(/[^a-z\s'-]/g, "").replace(/\s+/g, " ");
}
function dist(a, b) {
  const m = a.length;
  const n = b.length;
  const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}
function blankEx(w) {

function statusLabel(kind) {

function pool() {

function evenSample(list, n) {
  const groups = new Map();
  list.forEach((w) => {
    const arr = groups.get(w.cat) || [];
    arr.push(w);
    groups.set(w.cat, arr);
  });
  for (const [key, arr] of groups) groups.set(key, shuffle(arr));
  const keys = CATS.filter((cat) => groups.has(cat));
  const out = [];
  while (out.length < n) {
    let added = false;
    for (const key of keys) {
      const arr = groups.get(key);
      if (arr.length) {
        out.push(arr.pop());
        added = true;
        if (out.length >= n) break;
      }
    }
    if (!added) break;
  }
  return out;
}
function diversify(list) {

  return evenSample(list, list.length);
}
function pickSet(n) {
  const base = pool();
  const missed = diversify(base.filter((w) => state.learning[w.en] && !state.known[w.en]));
  const fresh = diversify(base.filter((w) => !state.known[w.en] && !state.learning[w.en]));
  const known = diversify(base.filter((w) => state.known[w.en]));
  const reviewSlots = Math.min(missed.length, Math.ceil(n / 2));
  const picked = missed.slice(0, reviewSlots);
  picked.push(...fresh.slice(0, n - picked.length));
  if (picked.length < n) picked.push(...missed.slice(reviewSlots, reviewSlots + (n - picked.length)));
  if (picked.length < n) picked.push(...known.slice(0, n - picked.length));

}

    state.lastDate = t;
  }
  if (state.todayDate !== t) {

    state.todayWords = [];

  if (success && !state.todayWords.includes(en)) state.todayWords.push(en);
}
function applyResult(w, ok) {

  if (ok) {

    delete state.learning[w.en];

    announce(w.en + " 맞았습니다.");
  } else {

    if (!app.misses.some((m) => m.en === w.en)) app.misses.push(w);

    '<p class="ko">' + esc(w.ko) + "</p>" +
    '<p class="meta">' + esc(w.pos) + " · " + esc(w.cat) + (kind === "learn" ? ' · <span class="tag">복습 필요</span>' : "") + "</p></div>" +
    '<button type="button" class="btn ' + (known ? "good" : "ghost") + '" data-action="toggle" data-en="' + esc(w.en) + '" aria-pressed="' + (known ? "true" : "false") + '">' + (known ? "아는 단어" : "알아요") + "</button></div>" +
    '<p class="exline"><span lang="en">' + esc(w.ex) + "</span><br>" + esc(w.exKo) + "</p></article>";
}
function renderGroups(words) {
  if (!words.length) return '<p class="empty">찾는 단어가 없습니다.</p>';
  const searching = (app.query || "").trim();
  if (searching || state.filter !== "전체") return words.map(wordRow).join("");
  return CATS.map((cat) => {
    const items = words.filter((w) => w.cat === cat);
    if (!items.length) return "";
    const known = items.filter((w) => state.known[w.en]).length;
    return '<h3 class="cat-title">' + esc(cat) + " <span>" + known + "/" + items.length + "</span></h3>" + items.map(wordRow).join("");
  }).join("");
}
function paintList() {
  const list = document.getElementById("list");
  if (!list) return;
  const words = filteredWords();
  list.innerHTML = renderGroups(words);
  const count = document.getElementById("listCount");
  if (count) count.textContent = words.length + "개";
}
function renderBook() {
  document.getElementById("stage").innerHTML =
    '<section class="panel"><div class="bookbar"><input id="q" placeholder="영어 또는 한국어로 검색" value="' + esc(app.query || "") + '"><p id="listCount"></p></div><div id="list"></div></section>';
  paintList();
  const q = document.getElementById("q");
  if (q && app.keepSearch) {
    q.focus();
    const end = q.value.length;
    q.setSelectionRange(end, end);
    app.keepSearch = false;
  }
}
function renderDone() {
  const total = app.queue.length;
  const misses = app.misses.map((w) => '<li><button type="button" class="word-btn" data-action="speak" data-say="' + esc(w.en) + '">' + speakerIcon() + esc(w.en) + "</button><span>" + esc(w.ko) + "</span></li>").join("");
  document.getElementById("stage").innerHTML =
    '<section class="panel done"><p class="eyebrow">라운드 완료</p><h2>' + app.correct + " / " + total + "</h2>" +
    "<p>" + (app.misses.length ? "틀린 단어를 아래에 모아 두었습니다. 맞힌 단어는 아는 단어로 저장했습니다." : "이번 라운드를 모두 맞혔습니다.") + "</p>" +
    (misses ? '<ul class="miss-list">' + misses + "</ul>" : "") +
    '<div class="actions"><button type="button" class="btn primary" data-action="again">한 라운드 더</button>' +
    (app.misses.length ? '<button type="button" class="btn ghost" data-action="retry">틀린 단어만</button>' : "") +
    '<button type="button" class="btn ghost" data-action="book">단어장 보기</button></div></section>';
}
function renderEmpty() {
  document.getElementById("stage").innerHTML = '<section class="panel"><p class="empty">이 범위에는 단어가 없습니다.</p></section>';
}
function show() {
  paintTabs();
  paintFilters();
  renderStats();
  paintHelp();
  if (app.phase === "done") return renderDone();
  if (app.mode === "book") return renderBook();
  if (!app.queue.length) return renderEmpty();
  if (app.mode === "card") return renderCard();
  if (app.mode === "quiz") return renderQuiz();
  if (app.mode === "type") return renderType();
}
function startRound(preset) {
  const source = Array.isArray(preset) && preset.length ? preset.slice() : pickSet(ROUND);
  app.queue = source;
  app.index = 0;
  app.phase = "run";
  app.flipped = false;
  app.locked = false;
  app.busy = false;
  app.correct = 0;
  app.misses = [];
  app.hint = 0;
  app.draft = "";
  app.picked = -1;
  app.choices = null;
  app.choiceKey = "";
  app.almost = false;
  show();
}
function setMode(mode) {
  const sameRunning = app.mode === mode && app.phase === "run" && (mode === "book" || app.queue.length);
  app.mode = mode;
  if (sameRunning) {
    paintTabs();
    return;
  }
  app.phase = "run";
  if (mode === "book") show();
  else startRound();
}
function setFilter(cat) {
  if (!cat || state.filter === cat) return;
  state.filter = cat;
  save();
  paintFilters();
  if (app.mode === "book") {
    paintList();
    return;
  }
  startRound();
}
function flip() {
  if (app.mode !== "card" || app.phase !== "run") return;
  app.flipped = !app.flipped;
  const card = document.getElementById("card");
  if (card) card.classList.toggle("flipped", app.flipped);
  const label = document.getElementById("flipLabel");
  if (label) label.textContent = app.flipped ? "단어 보기" : "뜻 보기";
}
function nextItem() {
  app.index += 1;
  app.flipped = false;
  app.locked = false;
  app.busy = false;
  app.hint = 0;
  app.draft = "";
  app.picked = -1;
  app.choices = null;
  app.choiceKey = "";
  app.almost = false;
  if (app.index >= app.queue.length) app.phase = "done";
  show();
}
function gradeCard(ok) {
  if (app.mode !== "card" || app.phase !== "run" || app.busy) return;
  app.busy = true;
  applyResult(current(), ok);
  nextItem();
}
function choose(i) {
  if (app.mode !== "quiz" || app.phase !== "run" || app.locked) return;
  const w = current();
  const choice = (app.choices || [])[i];
  if (!choice) return;
  app.picked = i;
  app.locked = true;
  app.almost = false;
  applyResult(w, choice.en === w.en);
  show();
}
function checkType() {
  if (app.mode !== "type" || app.phase !== "run" || app.locked) return;
  const input = document.getElementById("spell");
  app.draft = input ? input.value : app.draft;
  const w = current();
  const gap = dist(norm(app.draft), norm(w.en));
  app.almost = gap === 1;
  app.locked = true;
  applyResult(w, gap === 0);
  show();
}
function giveHint() {
  if (app.mode !== "type" || app.locked || app.phase !== "run" || app.hint >= 2) return;
  const input = document.getElementById("spell");
  if (input) app.draft = input.value;
  app.hint = Math.min(2, (app.hint || 0) + 1);
  show();
}
function toggleKnown(en) {
  if (state.known[en]) delete state.known[en];
  else {
    state.known[en] = true;
    delete state.learning[en];
  }
  save();
  renderStats();
  paintList();
}
function resetProgress() {
  if (!confirm("이 브라우저에 저장된 학습 기록을 모두 지울까요?")) return;
  state.known = {};
  state.learning = {};
  state.streak = 0;
  state.lastDate = "";
  state.todayDate = "";
  state.todayWords = [];
  save();
  if (app.mode === "book") show();
  else startRound();
}
function onStageClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn || !document.getElementById("stage").contains(btn)) {
    if (e.target.closest("#card") && app.mode === "card" && app.phase === "run") flip();
    return;
  }
  const action = btn.dataset.action;
  if (action === "flip") flip();
  else if (action === "know") gradeCard(true);
  else if (action === "miss") gradeCard(false);
  else if (action === "speak") speak(btn.dataset.say || "", btn.dataset.slow === "1");
  else if (action === "choose") choose(Number(btn.dataset.i));
  else if (action === "next") nextItem();
  else if (action === "check") checkType();
  else if (action === "hint") giveHint();
  else if (action === "again") startRound();
  else if (action === "retry") startRound(app.misses.slice());
  else if (action === "book") setMode("book");
  else if (action === "toggle") toggleKnown(btn.dataset.en);
  else if (action === "dir") {
    if (app.locked || app.quizDir === btn.dataset.dir) return;
    app.quizDir = btn.dataset.dir;
    app.choices = null;
    app.choiceKey = "";
    show();
  }
}

function mount() {
  document.getElementById("app").innerHTML =
    '<div class="top"><header><div class="brand"><div class="mark" aria-hidden="true">Aa</div><div><p class="eyebrow">Daily English</p><h1>영어 단어장</h1></div></div>' +
    '<div class="stats" id="stats"></div>' +
    '<button type="button" class="btn ghost" id="reset">기록 지우기</button></header>' +
    '<p class="lede">카드로 익히고, 퀴즈로 확인하고, 받아쓰기로 철자까지 연습합니다. 단어 ' + WORDS.length + '개.</p>' +
    '<nav class="tabs" id="tabs" aria-label="학습 방식"></nav>' +
    '<div class="filters" id="filters" aria-label="단어 범위"></div><p class="help" id="help"></p></div><main id="stage"></main>' +
    '<p class="foot">하루 목표 ' + GOAL + "개. 맞힌 단어와 연속 학습은 이 브라우저에 저장됩니다.</p>";

  const tabs = document.getElementById("tabs");
  [["card", "카드"], ["quiz", "퀴즈"], ["type", "받아쓰기"], ["book", "단어장"]].forEach(([mode, label]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab";
    btn.dataset.mode = mode;
    btn.textContent = label;
    btn.setAttribute("aria-selected", "false");
    tabs.appendChild(btn);
  });
  tabs.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-mode]");
    if (btn) setMode(btn.dataset.mode);
  });

  const filters = document.getElementById("filters");
  ["전체", ...CATS].forEach((cat) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.setAttribute("aria-pressed", "false");
    filters.appendChild(btn);
  });
  filters.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cat]");
    if (btn) setFilter(btn.dataset.cat);
  });

  document.getElementById("reset").addEventListener("click", resetProgress);
  const stage = document.getElementById("stage");
  stage.addEventListener("click", onStageClick);
  stage.addEventListener("input", (e) => {
    if (e.target.id === "q") {
      app.query = e.target.value;
      app.keepSearch = true;
      paintList();
    } else if (e.target.id === "spell") {
      app.draft = e.target.value;
    }
  });
  stage.addEventListener("keydown", (e) => {
    if (e.target.id === "spell" && e.key === "Enter") {
      e.preventDefault();
      if (app.locked) nextItem();
      else checkType();
    }
  });

  document.addEventListener("keydown", (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === " " && document.activeElement && document.activeElement.closest("button")) return;
    const onButton = document.activeElement && document.activeElement.closest("button");
    if (app.phase !== "run") {
      if (e.key === "Enter" && app.phase === "done" && !onButton) startRound();
      return;
    }
    if (app.mode === "card") {
      if (e.key === " ") { e.preventDefault(); flip(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); gradeCard(true); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); gradeCard(false); }
      else if (e.key === "s" || e.key === "S") speakCurrent(e.shiftKey);
    } else if (app.mode === "quiz") {
      if (["1", "2", "3", "4"].includes(e.key)) choose(Number(e.key) - 1);
      else if (e.key === "Enter" && app.locked && !onButton) { e.preventDefault(); nextItem(); }
    }
  });
}

mount();
setMode("card");
</script>
</body>
</html>
